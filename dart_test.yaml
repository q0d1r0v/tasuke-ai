# Declaring the tags stops `flutter test` printing
# "A tag was used that wasn't specified" for every tagged test.
tags:
  # Golden tests. Excluded from the default run because the default comparator
  # is an exact pixel match and the headless rasteriser does not render
  # BoxShadow identically across machines — a font or engine difference is a
  # red build with nothing useful to look at. Run them explicitly.
  golden:
    description: Pixel-comparison tests against committed golden files.
  # Drift schema-verification tests. Slow: each one opens a database at an old
  # schema version and migrates it forward.
  migration:
    description: Database migration and schema-verification tests.
  # Tests that need a real device or emulator, not the Dart VM.
  device:
    description: Requires a connected device or emulator.
  # Architecture rules enforced by reading the source. Fast, and they run in
  # the default suite — a layering violation should fail the same commit that
  # introduced it, not a later cleanup pass.
  arch:
    description: Source-scanning architecture guards.
