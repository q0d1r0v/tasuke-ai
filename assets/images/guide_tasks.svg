<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="blue" x1="130" y1="100" x2="390" y2="420" gradientUnits="userSpaceOnUse">
    <stop stop-color="#43B7FF"/>
    <stop offset="1" stop-color="#1268F3"/>
  </linearGradient>
  <radialGradient id="halo">
    <stop stop-color="#2F8BFF" stop-opacity=".18"/>
    <stop offset="1" stop-color="#2F8BFF" stop-opacity="0"/>
  </radialGradient>
</defs>

<circle cx="256" cy="256" r="220" fill="url(#halo)"/>

<!-- task cards.
     ⚠️ No <filter>: flutter_svg drops feDropShadow silently, so the source art's
     soft shadow never rendered on device. The 3pt #DCEBFF stroke is what
     separates each card from the halo behind it, and it is doing that job
     alone — do not thin it. -->
<g>
  <rect x="112" y="126" width="288" height="82" rx="24" fill="white" stroke="#DCEBFF" stroke-width="3"/>
  <rect x="126" y="216" width="288" height="82" rx="24" fill="white" stroke="#DCEBFF" stroke-width="3"/>
  <rect x="100" y="306" width="288" height="82" rx="24" fill="white" stroke="#DCEBFF" stroke-width="3"/>
</g>

