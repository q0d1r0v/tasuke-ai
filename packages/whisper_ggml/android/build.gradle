group 'com.devac.whisper_flutter'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // The Android Gradle Plugin knows how to build native code with the NDK.
        classpath 'com.android.tools.build:gradle:8.4.2'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace "com.devac.whisper_ggml"
    // Pinned to the NDK that Flutter 3.47.5 itself defaults to. Upstream asked
    // for 29.0.13113456; Gradle requires every module in the build to agree on
    // one NDK, so a plugin that demands a newer one than the Flutter tool's
    // default forces every consumer to install a second 2.5 GB NDK. whisper.cpp
    // v1.9.1 is plain C/C++ with NEON intrinsics and builds cleanly on 28.2.
    ndkVersion "28.2.13676358"

    compileSdk 34

    // Invoke the shared CMake build with the Android Gradle Plugin.
    externalNativeBuild {
        cmake {
            path "src/whisper/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdkVersion 21
        // Merged into consuming apps' R8 config: keeps the JNI entry points
        // that dart:ffi resolves by name. See consumer-rules.pro.
        consumerProguardFiles 'consumer-rules.pro'
        ndk {
            // Flutter does not currently support building for x86 Android (See Issue 9253).
            // x86 dropped: Flutter has not supported 32-bit x86 Android since 1.22,
            // and building it only lengthens the native link.
            abiFilters("armeabi-v7a", "x86_64", "arm64-v8a")
        }
        externalNativeBuild {
            cmake {
                // No thin-LTO: with the full whisper.cpp v1.9.1 source tree
                // it multiplies link time for no meaningful size win.
                cFlags "-O3 -ffunction-sections -fdata-sections"
                cppFlags "-O3 -ffunction-sections -fdata-sections"
                arguments "-DANDROID_STL=c++_static", "-DCMAKE_BUILD_TYPE=Release"
            }
        }
    }
}
