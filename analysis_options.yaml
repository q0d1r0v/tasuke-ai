include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # freezed/json_serializable place annotations on generated members
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.drift.dart"
    # gen_l10n output. Not hand-written, and it satisfies neither
    # `require_trailing_commas` nor `prefer_single_quotes`.
    - "lib/app/l10n/app_localizations*.dart"
    # drift's committed schema snapshots and the code generated from them.
    - "drift_schemas/**"
    - "test/core/database/generated/**"
    # The vendored whisper.cpp binding keeps upstream's own style.
    - "packages/whisper_ggml/**"
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - unawaited_futures
    - use_build_context_synchronously
